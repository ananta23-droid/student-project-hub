name: Deploy to Production

on:
  push:
    branches: [ main ]

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NODE_ENV: production

jobs:
  validate-backend:
    runs-on: ubuntu-latest
    name: Validate Backend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      
      - name: Check syntax
        working-directory: backend
        run: |
          node -c server.js
          echo "✅ Backend validation passed"

  build-frontend:
    runs-on: ubuntu-latest
    name: Build Frontend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      
      - name: Build
        working-directory: frontend
        run: npm run build
      
      - name: Verify dist
        working-directory: frontend
        run: |
          if [ -d "dist" ]; then
            echo "✅ Frontend build successful"
            du -sh dist/
          else
            echo "❌ Build failed"
            exit 1
          fi

  deploy-backend:
    needs: validate-backend
    runs-on: ubuntu-latest
    name: Deploy Backend to Render
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "⚠️  Render webhook not configured"
          else
            curl --location --request POST "$RENDER_DEPLOY_HOOK"
            echo "✅ Render deployment triggered"
          fi

  deployment-status:
    needs: [ build-frontend, deploy-backend ]
    runs-on: ubuntu-latest
    name: Deployment Status
    if: always()
    
    steps:
      - name: Show status
        run: |
          echo "🚀 DEPLOYMENT COMPLETE"
          echo "Frontend: https://student-project-hub-rosy.vercel.app"
          echo "Backend: https://student-project-hub-backend.onrender.com"
          echo ""
          echo "Commit: ${{ github.sha }}"
          echo "Author: ${{ github.actor }}"