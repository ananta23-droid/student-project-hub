name: Deploy to Production

on:
  push:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: true

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: |
          frontend/package-lock.json
          backend/package-lock.json

    - name: Frontend - Install & Build
      working-directory: frontend
      run: |
        npm ci --no-optional --silent
        npm run build --if-present

    - name: Backend - Install
      working-directory: backend
      run: npm ci --no-optional --silent

    - name: Deployment validation
      run: echo "✅ All checks passed! Ready to deploy."

  notify-deployment:
    needs: test-and-build
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Create deployment summary
      run: |
        cat > deployment-info.txt << 'DEPLOY_EOF'
        🚀 DEPLOYMENT SUMMARY
       
        
        Frontend: https://student-project-hub-rosy.vercel.app
        Backend: https://student-project-hub-backend.onrender.com
        
        Commit: ${{ github.sha }}
        Author: ${{ github.actor }}
        
        ✅ CI/CD Pipeline Successful!
        DEPLOY_EOF
        cat deployment-info.txt
    
    - name: Notify success
      run: |
        echo "✅ Deployment completed successfully!"
        echo "Frontend deployed to Vercel"
        echo "Backend deployed to Render"